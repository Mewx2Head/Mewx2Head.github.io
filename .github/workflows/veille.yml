name: Veille RSS

on:
  schedule:
    - cron: "17 5,11,17 * * *"   # 3 fois par jour
  workflow_dispatch:              # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: [scripts/veille.py, .github/workflows/veille.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les flux
        run: python scripts/veille.py
      - name: Publier veille.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add veille.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour automatique de la veille"
          git push
